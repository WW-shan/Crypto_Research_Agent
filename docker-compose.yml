services:
  crypto-alpha-agent:
    build:
      context: .
    image: crypto-alpha-agent:local
    env_file:
      - .env
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./var:/app/var
      - ./.env:/app/.env:ro
    command: ["--help"]
    restart: "no"
